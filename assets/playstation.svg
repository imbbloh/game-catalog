<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="#0070D1" role="img" aria-label="PlayStation">
  <defs>
    <!-- One narrow vertical slit does double duty: inside the bowl it forms the
         P's counter, and below the bowl it keeps the stem clear of the S. -->
    <mask id="ps-slit">
      <rect width="512" height="512" fill="#fff"/>
      <rect x="283" y="112" width="20" height="356" rx="10" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#ps-slit)">
    <!-- P: stem plus bowl as one solid form -->
    <path d="M190 57h140c72 0 98 45 98 117 0 72-46 118-120 118h-23v170h-95z"/>
    <!-- S: one flattened ribbon — hooks left at the top, right at the bottom -->
    <path fill="none" stroke="#0070D1" stroke-width="46" stroke-linecap="round"
          d="M155 400c-75-4-125-15-127-42-2-26 62-42 147-48 85-6 205 0 265 15 50 12 60 35 30 60-30 25-120 47-185 57"/>
  </g>
</svg>
